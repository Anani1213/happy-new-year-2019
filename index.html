<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>መልካም አዲስ ዓመት 2019!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0d1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* ቆጠራ (Countdown) */
    #countdown-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070711;
      z-index: 10;
      transition: opacity 1s ease;
    }

    .num {
      font-size: 8rem;
      font-weight: bold;
      color: #ffcf40;
      text-shadow: 0 0 25px rgba(255, 207, 64, 0.8);
      animation: pop 0.9s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* ዋና መግለጫ (Main Content) */
    #main-content {
      opacity: 0;
      transform: scale(0.8);
      transition: all 1.5s ease;
      z-index: 5;
      padding: 20px;
      max-width: 600px;
    }

    #main-content.show {
      opacity: 1;
      transform: scale(1);
    }

    h1 {
      font-size: 2.8rem;
      color: #ffdf00;
      text-shadow: 0 0 15px #ff7700, 0 0 30px #ff0055;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    p.greeting {
      font-size: 1.3rem;
      color: #e0e0e0;
      line-height: 1.8;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .yellow-flower {
      font-size: 2rem;
      margin-top: 15px;
      display: block;
    }

    /* Fireworks Canvas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- የ 3 2 1 ቆጠራ ማሳያ -->
  <div id="countdown-screen">
    <div class="num" id="countdown-num">3</div>
  </div>

  <!-- የ ርችት ካንቫስ -->
  <canvas id="fireworks"></canvas>

  <!-- መልካም ምኞት መግለጫ -->
  <div id="main-content">
    <span class="yellow-flower">🌼🌼🌼</span>
    <h1>መልካም አዲስ ዓመት<br>2019!</h1>
    <p class="greeting">
      እንኳን ለ፪ሺ፲፱ (2019) አዲስ ዓመት በሰላም አደረሳችሁ! <br>
      አዲሱ ዓመት የሰላም፣ የጤና፣ የፍቅርና የስኬት ይሁንላችሁ። ህልሞቻችሁ ሁሉ የሚሳኩበት ያድርግላችሁ! ✨💛
    </p>
  </div>

  <script>
    // 1. የቆጠራ ስክሪፕት
    const countEl = document.getElementById('countdown-num');
    const screenEl = document.getElementById('countdown-screen');
    const mainContent = document.getElementById('main-content');
    
    let count = 3;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countEl.textContent = count;
      } else {
        clearInterval(interval);
        screenEl.style.opacity = '0';
        setTimeout(() => {
          screenEl.style.display = 'none';
          mainContent.classList.add('show');
          startFireworks(); // ርችት እንዲተኮስ ማድረግ
        }, 1000);
      }
    }, 1000);

    // 2. የርችት (Fireworks) አኒሜሽን
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.velocity = {
          x: (Math.random() - 0.5) * 8,
          y: (Math.random() - 0.5) * 8
        };
        this.alpha = 1;
        this.friction = 0.98;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.015;
      }
    }

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.6);
      const colors = ['#ff0055', '#ffdd00', '#00efff', '#ff00ff', '#00ff66'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(13, 13, 26, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });
    }

    function startFireworks() {
      animate();
      setInterval(createFirework, 800);
    }
  </script>
</body>
</html>
