<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>መልካም አዲስ ዓመት 2019!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* 1. የመክፈቻ ስክሪን (Start Overlay) */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a16;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .start-btn {
      background: linear-gradient(45deg, #ff9900, #ff0055);
      color: #fff;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 18px 35px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.6);
      animation: pulse 1.5s infinite;
      margin-top: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(255, 0, 85, 0.8); }
      100% { transform: scale(1); }
    }

    /* 2. የ 3 2 1 ቆጠራ */
    #countdown-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: #070711;
      z-index: 10;
    }

    .num {
      font-size: 9rem;
      font-weight: bold;
      color: #ffcf40;
      text-shadow: 0 0 30px rgba(255, 207, 64, 0.9);
      animation: pop 0.9s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* 3. ዋና መግለጫ (Main Content) */
    #main-content {
      opacity: 0;
      transform: scale(0.8);
      transition: all 1.5s ease;
      z-index: 5;
      padding: 20px;
      max-width: 600px;
    }

    #main-content.show {
      opacity: 1;
      transform: scale(1);
    }

    h1 {
      font-size: 2.8rem;
      color: #ffdf00;
      text-shadow: 0 0 15px #ff7700, 0 0 30px #ff0055;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    p.greeting {
      font-size: 1.25rem;
      color: #e0e0e0;
      line-height: 1.8;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 22px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 215, 0, 0.25);
    }

    .yellow-flower {
      font-size: 2.2rem;
      margin-bottom: 10px;
      display: block;
    }

    /* Fireworks Canvas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- የመክፈቻ ገጽ (Start Button) -->
  <div id="start-screen">
    <span style="font-size: 3rem; margin-bottom: 10px;">🌼🌼🌼</span>
    <h2 style="color: #ffdf00; margin-bottom: 10px;">የአዲስ ዓመት ስጦታ ደርሶዎታል!</h2>
    <button class="start-btn" onclick="startApp()">🎁 ለማየት እዚህ ይጫኑ</button>
  </div>

  <!-- የ ቆጠራ ማሳያ -->
  <div id="countdown-screen">
    <div class="num" id="countdown-num">3</div>
  </div>

  <!-- የ ርችት ካንቫስ -->
  <canvas id="fireworks"></canvas>

  <!-- መልካም ምኞት መግለጫ -->
  <div id="main-content">
    <span class="yellow-flower">🌼🌼🌼</span>
    <h1>መልካም አዲስ ዓመት<br>2019!</h1>
    <p class="greeting">
      እንኳን ለ፪ሺ፲፱ (2019) አዲስ ዓመት በሰላም አደረሳችሁ! <br><br>
      አዲሱ ዓመት የሰላም፣ የጤና፣ የፍቅርና የምስራች ዘመን ይሁንላችሁ! ህልሞቻችሁና ስኬቶቻችሁ ሁሉ የሚሳኩበት ያድርግላችሁ! ✨💛
    </p>
  </div>

  <script>
    // Audio Context Setup
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1. የቆጠራ ድምፅ (Beep Sound)
    function playBeepSound(isFinal = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(isFinal ? 880 : 440, audioCtx.currentTime); 

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // 2. እውነተኛ የእርችት ድምፅ (Realistic Explosion Sound)
    function playExplosionSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Sub-Bass Boom (ዝቅተኛ የፍንዳታ ድምፅ)
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
      oscGain.gain.setValueAtTime(0.8, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.4);

      // White Noise Crackle (የርችቱ ስብርብር ድምፅ)
      const bufferSize = audioCtx.sampleRate * 0.8;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(700 + Math.random() * 300, now);
      filter.frequency.exponentialRampToValueAtTime(80, now + 0.7);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.5, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);

      whiteNoise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      whiteNoise.start(now);
      whiteNoise.stop(now + 0.8);
    }

    // ፕሮግራሙን የመስራት ተግባር
    function startApp() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      const countScreen = document.getElementById('countdown-screen');
      const countEl = document.getElementById('countdown-num');
      const mainContent = document.getElementById('main-content');

      countScreen.style.display = 'flex';
      
      let count = 3;
      playBeepSound(false);

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
          playBeepSound(false);
        } else {
          clearInterval(interval);
          playBeepSound(true); // የመጨረሻው ድምፅ
          
          countScreen.style.opacity = '0';
          setTimeout(() => {
            countScreen.style.display = 'none';
            mainContent.classList.add('show');
            startFireworks();
          }, 800);
        }
      }, 1000);
    }

    // የርችት አኒሜሽን (Fireworks Animation)
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.velocity = {
          x: (Math.random() - 0.5) * 10,
          y: (Math.random() - 0.5) * 10
        };
        this.alpha = 1;
        this.friction = 0.96;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.015;
      }
    }

    function createFirework() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.55);
      const colors = ['#ff0055', '#ffdd00', '#00efff', '#ff00ff', '#00ff66', '#ffffff'];
      const color = colors[Math.floor(Math.random() * colors.length)];

      playExplosionSound(); // እያንዳንዱ ርችት ሲፈነዳ ድምፅ ያወጣል

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(10, 10, 22, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });
    }

    function startFireworks() {
      animate();
      createFirework();
      setInterval(createFirework, 900); // በየ 0.9 ሰከንዱ አዲስ ርችትና ድምፅ
    }
  </script>
</body>
</html>
