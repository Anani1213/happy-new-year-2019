<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>መልካም አዲስ ዓመት 2019!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #05050f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* 1. የመክፈቻ ስክሪን */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #05050f;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .start-btn {
      background: linear-gradient(45deg, #ff9900, #ff0055);
      color: #fff;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 18px 35px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.7);
      animation: pulse 1.2s infinite;
      margin-top: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(255, 0, 85, 0.9); }
      100% { transform: scale(1); }
    }

    /* 2. የ 3 2 1 ቆጠራ */
    #countdown-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: #04040a;
      z-index: 10;
    }

    .num {
      font-size: 9rem;
      font-weight: bold;
      color: #ffcf40;
      text-shadow: 0 0 35px rgba(255, 207, 64, 0.9);
      animation: pop 0.9s infinite;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* 3. ዋና መግለጫ */
    #main-content {
      opacity: 0;
      transform: scale(0.7);
      transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
      padding: 20px;
      max-width: 600px;
    }

    #main-content.show {
      opacity: 1;
      transform: scale(1);
    }

    h1 {
      font-size: 2.8rem;
      color: #ffdf00;
      text-shadow: 0 0 15px #ff7700, 0 0 30px #ff0055, 0 0 45px #ff0055;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    p.greeting {
      font-size: 1.25rem;
      color: #ffffff;
      line-height: 1.8;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 22px;
      border-radius: 15px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .yellow-flower {
      font-size: 2.3rem;
      margin-bottom: 10px;
      display: block;
    }

    /* Fireworks Canvas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- የመክፈቻ ገጽ -->
  <div id="start-screen">
    <span style="font-size: 3.5rem; margin-bottom: 10px;">🌼🌼🌼</span>
    <h2 style="color: #ffdf00; margin-bottom: 10px;">የአዲስ ዓመት ስጦታ ደርሶዎታል!</h2>
    <button class="start-btn" onclick="startApp()">🎁 ለማየት እዚህ ይጫኑ</button>
  </div>

  <!-- የ ቆጠራ ማሳያ -->
  <div id="countdown-screen">
    <div class="num" id="countdown-num">3</div>
  </div>

  <!-- የ ርችት ካንቫስ -->
  <canvas id="fireworks"></canvas>

  <!-- መልካም ምኞት መግለጫ -->
  <div id="main-content">
    <span class="yellow-flower">🌼🌼🌼</span>
    <h1>መልካም አዲስ ዓመት<br>2019!</h1>
    <p class="greeting">
      እንኳን ለ፪ሺ፲፱ (2019) አዲስ ዓመት በሰላም አደረሳችሁ! <br><br>
      አዲሱ ዓመት የሰላም፣ የጤና፣ የፍቅርና የምስራች ዘመን ይሁንላችሁ! ህልሞቻችሁና ስኬቶቻችሁ ሁሉ የሚሳኩበት ያድርግላችሁ! ✨💛
    </p>
  </div>

  <script>
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1. የቆጠራ ድምፅ
    function playBeepSound(isFinal = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(isFinal ? 880 : 440, audioCtx.currentTime); 

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // 2. ፈጣንና እውነተኛ የፍንዳታ ድምፅ (Explosion Sound with pitch variation)
    function playExplosionSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Pitch variation ለተደራራቢ ፍንዳታዎች
      const pitchShift = (Math.random() - 0.5) * 50;

      // Sub-Bass Boom
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180 + pitchShift, now);
      osc.frequency.exponentialRampToValueAtTime(25, now + 0.3);
      oscGain.gain.setValueAtTime(0.5, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);

      // Crackle Noise
      const bufferSize = audioCtx.sampleRate * 0.4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900 + Math.random() * 500, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + 0.4);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.3, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

      whiteNoise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      whiteNoise.start(now);
      whiteNoise.stop(now + 0.4);
    }

    // ፕሮግራሙን ማስጀመር
    function startApp() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      const countScreen = document.getElementById('countdown-screen');
      const countEl = document.getElementById('countdown-num');
      const mainContent = document.getElementById('main-content');

      countScreen.style.display = 'flex';
      
      let count = 3;
      playBeepSound(false);

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.textContent = count;
          playBeepSound(false);
        } else {
          clearInterval(interval);
          playBeepSound(true);
          
          countScreen.style.opacity = '0';
          setTimeout(() => {
            countScreen.style.display = 'none';
            mainContent.classList.add('show');
            startFireworks();
          }, 800);
        }
      }, 1000);
    }

    // የርችት አኒሜሽን (Dynamic Chaotic Fireworks)
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3.5 + 1;
        
        // ፈጣን እና ሰፊ ስብርብር
        const speed = Math.random() * 12 + 2;
        const angle = Math.random() * Math.PI * 2;
        this.velocity = {
          x: Math.cos(angle) * speed,
          y: Math.sin(angle) * speed
        };
        this.alpha = 1;
        this.friction = 0.95; 
        this.gravity = 0.15; // የስበት ኃይል (ወደ ታች የመርገፍ ተፅዕኖ)
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.018;
      }
    }

    function createFirework() {
      // በአንድ ጊዜ ከ 1 እስከ 3 የሚደርሱ እርችቶች በዘፈቀደ እንዲፈነዱ ማድረግ
      const burstCount = Math.floor(Math.random() * 3) + 1;

      for (let b = 0; b < burstCount; b++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.6);
        const colors = ['#ff0055', '#ffdd00', '#00efff', '#ff00ff', '#00ff66', '#ffffff', '#ff7700', '#00ffa2'];
        const color = colors[Math.floor(Math.random() * colors.length)];

        playExplosionSound();

        for (let i = 0; i < 65; i++) {
          particles.push(new Particle(x, y, color));
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(5, 5, 15, 0.25)'; // የርችቱ ጭስ መስመር ተፅዕኖ
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });
    }

    function startFireworks() {
      animate();
      createFirework();
      // በየ 250 ሚሊሰከንዱ በጣም በፍጥነት እርችቶች ይተኮሳሉ
      setInterval(createFirework, 250);
    }
  </script>
</body>
</html>
